name: Planner
options:
  bundleIdPrefix: com.fazz
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Planner:
    type: application
    platform: iOS
    sources: [Planner]
    info:
      path: Planner/Info.plist
      properties:
        CFBundleDisplayName: Планер
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fazz.planner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
